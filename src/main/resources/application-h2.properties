# Fallback profile: runs with NO installation. Data is lost when the app stops.
# Use it for quick testing. Do the final demo on the real database (profile "local").
spring.datasource.url=jdbc:h2:mem:parking;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# H2 reports column types a little differently, so skip Hibernate's schema check here.
# Flyway still builds the schema from the same migration files.
spring.jpa.hibernate.ddl-auto=none
