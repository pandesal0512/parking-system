# ---------------------------------------------------------------
# Shared settings. NO secrets in this file (it is committed to Git).
#
# Profiles:
#   h2    (default) in-memory database, zero setup, data is lost on restart
#   local MySQL/MariaDB. Copy application-example.properties to
#         application-local.properties and fill in your own values.
# ---------------------------------------------------------------
spring.application.name=parking-system
spring.profiles.default=h2

# Schema is created ONLY by Flyway migrations (db/migration).
# Hibernate just checks that the code matches the schema.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# We do our own JWT login, so turn off Spring's default generated user/password.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# Never leak internals in error responses
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# ----- App settings (values come from environment variables when set) -----
# JWT signing secret, at least 32 characters. If empty, a random one is
# generated at startup (everyone is logged out whenever the app restarts).
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=60

# First super admin. Created only if no super admin exists yet.
# If the password is empty, a random one is generated and printed ONCE in the console.
app.seed-admin.username=${SEED_ADMIN_USERNAME:superadmin}
app.seed-admin.full-name=System Administrator
app.seed-admin.password=${SEED_ADMIN_PASSWORD:}
# Forgot the super admin password? Set SEED_ADMIN_RESET=true together with SEED_ADMIN_PASSWORD, start the
# app once, sign in, change the password, then remove both settings.
app.seed-admin.reset-password=${SEED_ADMIN_RESET:false}

# Vehicles: false = a manager must approve each new vehicle, true = approved automatically
app.vehicle.auto-approve=${VEHICLE_AUTO_APPROVE:false}

# Reservation rules
app.reservation.max-hours=10
app.reservation.max-days-ahead=7
app.reservation.grace-minutes=15
app.reservation.cancel-cutoff-minutes=60
# One user can reserve this many times for the same calendar day (stops spamming).
app.reservation.max-per-day=1
# false = a parking manager must approve each reservation. true = approved immediately.
app.reservation.auto-approve=false

# Account lockout after repeated wrong passwords
app.lockout.max-failed-attempts=5
app.lockout.lock-minutes=15

# Penalties. A user with this many no-shows can no longer reserve (a manager can clear it).
app.penalty.no-show-ban-threshold=3
# After an overstay the user cannot reserve or enter for this many days.
app.penalty.overstay-suspension-days=3
# Background check for no-shows and overstays, every N seconds.
app.penalty.job-enabled=${PENALTY_JOB_ENABLED:true}
app.penalty.check-seconds=60

# Logs older than this are deleted once a day (about 1 month, as the team decided).
app.logs.retention-days=30
app.logs.cleanup-enabled=${LOG_CLEANUP_ENABLED:true}

# DEMO ONLY. true lets the super admin move the system clock forward so no-shows and
# overstays can be shown in minutes. Keep it false for anything that is not a demo.
app.demo.time-control=${DEMO_TIME_CONTROL:false}

# DEMO ONLY. true adds sample users, vehicles and reservations at startup (password in the console).
app.demo.seed-data=${DEMO_SEED_DATA:false}

# Gate hardware (ESP32). The hardware sends this secret in the X-Device-Key header.
# Empty = the hardware endpoints are OFF. Use a long random value (20+ characters) and keep it out of git.
app.device.api-key=${DEVICE_API_KEY:}
# A device counts as online if it was heard from within this many seconds.
app.device.online-seconds=30
