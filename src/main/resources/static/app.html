<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mabini Colleges Parking</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/shared.js"></script>
</head>
<body>
<div class="app">
    <aside class="sidebar" id="sidebar">
        <div class="side-head">
            <a class="brand" href="app.html">
                <span class="sign" aria-hidden="true">P</span>
                <span class="brand-name">Parking</span>
            </a>
            <button type="button" id="menu-toggle" class="menu-toggle" aria-expanded="false" aria-controls="side-body">Menu</button>
        </div>

        <div class="side-body" id="side-body">
            <nav id="nav" aria-label="Main"></nav>

            <div class="user">
                <div id="user-menu" class="user-menu" role="menu" hidden>
                    <div class="user-menu-head" id="menu-username"></div>
                    <a role="menuitem" href="#settings" id="menu-settings">Settings</a>
                    <button type="button" role="menuitem" id="logout">Log out</button>
                </div>
                <button type="button" id="user-button" class="user-button" aria-haspopup="menu" aria-expanded="false">
                    <span class="avatar" id="avatar" aria-hidden="true"></span>
                    <span class="user-text">
                        <span id="who-name" class="who-name"></span>
                        <span id="who-role" class="who-role"></span>
                    </span>
                </button>
            </div>
        </div>
    </aside>

    <main id="content" tabindex="-1"></main>
</div>

<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/pages-user.js"></script>
<script src="js/pages-staff.js"></script>
<script src="js/pages-admin.js"></script>
<script src="js/app.js"></script>
</body>
</html>
